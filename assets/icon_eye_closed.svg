<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Single WHITE ink, 16x16 native. Layer is hidden: a lowered lid with three lashes hanging just
       clear of it. Deliberately NOT a slashed eye -- a slash needs a knocked-out gap where it
       crosses the almond to read cleanly, and a one-ink alpha icon cannot punch the panel ground
       back in through itself.

       1.5px strokes for the same reason as icon_eye_open.svg: a curve cannot be pixel-aligned, and
       at 1px it rasterizes to pure grey. The centre lash is the one vertical here and it straddles
       the 16px grid's midline, so it takes 2px to land solid on both columns. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round">
    <path d="M2 7 Q8 12 14 7"/>
    <path d="M5 9.2 L4 11.4"/>
    <path d="M11 9.2 L12 11.4"/>
    <path d="M8 9.7 V12.2" stroke-width="2"/>
  </g>
</svg>
