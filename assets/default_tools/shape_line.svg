<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="16" height="16" viewBox="0 0 16 16">
  <defs>
    <linearGradient id="shapeFill" gradientUnits="userSpaceOnUse" x1="8" y1="3" x2="8" y2="13">
      <stop offset="0" style="stop-color:#9cbde0"/>
      <stop offset="1" style="stop-color:#4d7fb8"/>
    </linearGradient>
  </defs>
  <path d="M 3,13 L 13,3" style="fill:none;stroke:#204a87;stroke-width:3;stroke-linecap:round"/>
