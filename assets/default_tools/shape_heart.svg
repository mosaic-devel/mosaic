<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Mosaic original (CC0): Heart shape tool. One filled primitive in the tango blues so the shape
     family sits beside the GIMP color icons; four cubic lobes, tight in the 16x16 box exactly as
     the geometry is tight in its own. nanosvg-safe: shapes + gradients only. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="16" height="16" viewBox="0 0 16 16">
  <defs>
    <linearGradient id="shapeFill" gradientUnits="userSpaceOnUse" x1="8" y1="2" x2="8" y2="14">
      <stop offset="0" style="stop-color:#9cbde0"/>
      <stop offset="1" style="stop-color:#4d7fb8"/>
    </linearGradient>
  </defs>
  <path d="M 8,4.82 C 8,3.41 6.7,2 4.75,2 C 2.15,2 1.5,4.82 1.5,5.53 C 1.5,9.06 4.75,11.18 8,14 C 11.25,11.18 14.5,9.06 14.5,5.53 C 14.5,4.82 13.85,2 11.25,2 C 9.3,2 8,3.41 8,4.82 Z"
        style="fill:url(#shapeFill);stroke:#204a87;stroke-width:1;stroke-linejoin:round"/>
</svg>
