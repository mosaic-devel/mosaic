<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Mosaic original (CC0): Chevron / banner shape tool. One filled primitive in the tango blues so
     the shape family sits beside the GIMP color icons; the point on the right and the matching
     notch on the left are the shape's two parameters. nanosvg-safe: shapes + gradients only. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="16" height="16" viewBox="0 0 16 16">
  <defs>
    <linearGradient id="shapeFill" gradientUnits="userSpaceOnUse" x1="8" y1="3.5" x2="8" y2="12.5">
      <stop offset="0" style="stop-color:#9cbde0"/>
      <stop offset="1" style="stop-color:#4d7fb8"/>
    </linearGradient>
  </defs>
  <polygon points="1.5,3.5 11.5,3.5 14.5,8 11.5,12.5 1.5,12.5 4.5,8"
           style="fill:url(#shapeFill);stroke:#204a87;stroke-width:1;stroke-linejoin:round"/>
</svg>
