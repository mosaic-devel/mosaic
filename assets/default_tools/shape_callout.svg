<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Mosaic original (CC0): Speech-bubble (callout) shape tool. One filled primitive in the tango
     blues so the shape family sits beside the GIMP color icons; the tail is part of the SAME
     outline, exactly as the geometry splices it. nanosvg-safe: shapes + gradients only. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="16" height="16" viewBox="0 0 16 16">
  <defs>
    <linearGradient id="shapeFill" gradientUnits="userSpaceOnUse" x1="8" y1="2.5" x2="8" y2="14.4">
      <stop offset="0" style="stop-color:#9cbde0"/>
      <stop offset="1" style="stop-color:#4d7fb8"/>
    </linearGradient>
  </defs>
  <path d="M 3.5,2.5 L 12.5,2.5 A 2,2 0 0 1 14.5,4.5 L 14.5,9 A 2,2 0 0 1 12.5,11 L 7.6,11 L 3.4,14.4 L 4.9,11 L 3.5,11 A 2,2 0 0 1 1.5,9 L 1.5,4.5 A 2,2 0 0 1 3.5,2.5 Z"
        style="fill:url(#shapeFill);stroke:#204a87;stroke-width:1;stroke-linejoin:round"/>
</svg>
