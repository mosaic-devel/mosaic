<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Mosaic original (CC0): Rectangle shape tool. One filled primitive in the tango blues so the
     shape family sits beside the GIMP color icons; solid fill = draws-a-shape (the dashed
     marquee icons own selection). nanosvg-safe: shapes + gradients only. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="16" height="16" viewBox="0 0 16 16">
  <defs>
    <linearGradient id="shapeFill" gradientUnits="userSpaceOnUse" x1="8" y1="3.75" x2="8" y2="12.25">
      <stop offset="0" style="stop-color:#9cbde0"/>
      <stop offset="1" style="stop-color:#4d7fb8"/>
    </linearGradient>
  </defs>
  <rect x="2.5" y="3.75" width="11" height="8.5" rx="0.6"
        style="fill:url(#shapeFill);stroke:#204a87;stroke-width:1;stroke-linejoin:round"/>
</svg>
