<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Mosaic original (CC0): Cross / plus shape tool. One filled primitive in the tango blues so the
     shape family sits beside the GIMP color icons; twelve vertices, the same ones the geometry
     emits. nanosvg-safe: shapes + gradients only. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="16" height="16" viewBox="0 0 16 16">
  <defs>
    <linearGradient id="shapeFill" gradientUnits="userSpaceOnUse" x1="8" y1="1.5" x2="8" y2="14.5">
      <stop offset="0" style="stop-color:#9cbde0"/>
      <stop offset="1" style="stop-color:#4d7fb8"/>
    </linearGradient>
  </defs>
  <polygon points="5.7,1.5 10.3,1.5 10.3,5.7 14.5,5.7 14.5,10.3 10.3,10.3 10.3,14.5 5.7,14.5 5.7,10.3 1.5,10.3 1.5,5.7 5.7,5.7"
           style="fill:url(#shapeFill);stroke:#204a87;stroke-width:1;stroke-linejoin:round"/>
</svg>
