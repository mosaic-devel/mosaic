<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Single WHITE ink, 16x16 native. Layer is visible.

       The almond is a pure curve, so it cannot sit on the pixel grid the way the straight-edged
       icons do. A 1px stroke on it therefore rasterizes to nothing but half-covered pixels -- a
       grey smear, and the reason the eye read as the blurriest of the set. 1.5px gives the curve a
       fully-inked core with anti-aliased shoulders, which is what a crisp curve actually looks
       like. The pupil is a filled disc for the same reason: solid ink, AA only at its rim. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.5">
    <path d="M1.2 8 C3.2 4.6 5.5 3.2 8 3.2 C10.5 3.2 12.8 4.6 14.8 8 C12.8 11.4 10.5 12.8 8 12.8 C5.5 12.8 3.2 11.4 1.2 8 Z"/>
  </g>
  <circle cx="8" cy="8" r="2.2" fill="#FFFFFF"/>
</svg>
